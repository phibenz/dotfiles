onboarding = false
[ui]
agent_panel_sort = "priority"
pane_borders = true
pane_gaps = false
pane_scrollbars = false
tab_bar_right = [
  { type = "command", command = '''printf '%s' "${HERDR_ACTIVE_PANE_ID:--}"''', interval_seconds = 1, timeout_seconds = 1 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

status_indicators = "dots"
[keys]
prefix = "ctrl+a"
detach = "prefix+q"
workspace_picker = "prefix+g"
goto = "prefix+space"
previous_agent = ["prefix+shift+up", "prefix+u"]
next_agent = ["prefix+shift+down", "prefix+d"]
focus_agent = "prefix+shift+1..9"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
split_vertical = "prefix+v"
split_horizontal = 'prefix+"'
toggle_sidebar = "prefix+b"

# Navigate Neovim splits first, then cross into adjacent Herdr panes.
[[keys.command]]
key = "prefix+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Neovim/Herdr)"

[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Neovim/Herdr)"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Neovim/Herdr)"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Neovim/Herdr)"

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "top-right"

[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", "terminal_title_stripped"],
]

[ui.sound]
enabled = false
