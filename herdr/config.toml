onboarding = false
[ui]
agent_panel_sort = "priority"
pane_borders = true
pane_gaps = false
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
detach = "prefix+q"
workspace_picker = "prefix+g"
goto = "prefix+space"
previous_agent = ["prefix+shift+up", "prefix+u"]
next_agent = ["prefix+shift+down", "prefix+d"]
focus_agent = "prefix+shift+1..9"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
split_vertical = "prefix+v"
split_horizontal = 'prefix+"'
toggle_sidebar = "prefix+b"

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", "terminal_title_stripped"],
]

[ui.sound]
enabled = false
